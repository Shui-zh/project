pcd_to_pgm:
  ros__parameters:
    pcd_file: data/rmul_2025.pcd   
    output_dir: output                     
    resolution: 0.05                       
    z_min: 0.1             
    z_max: 1.5
    frame_id: map

astar_planner:
  ros__parameters:
    start_x: 1.0
    start_y: 1.0
    goal_x: 7.0
    goal_y: 11.0
    occupied_thresh: 50
    allow_diagonal: true
    inflation_cells: 3
    frame_id: map

min_snap:
  ros__parameters:
    occupied_thresh: 50
    v_ref: 1.0              
    min_seg_time: 0.5
    max_seg_time: 8.0
    insert_spacing: 2.0
    max_rect_half: 0.30
    min_rect_half: 0.03        
    collision_dt: 0.01      
    sample_dt: 0.05         
    max_iters: 12
    obstacle_margin: 0.03                    
